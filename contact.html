<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Haven | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">Food Haven</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="current">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact us</h1>
    <p>Call us, visit us, or send a message below.</p>

    <h2>Details</h2>
    <p>
      Address: Your street address, Islamabad<br>
      Phone: 0300-0000000<br>
      Email: <a href="mailto:hello@foodhaven.example">hello@foodhaven.example</a>
    </p>

    <h2>Send a message</h2>
    <form action="mailto:hello@foodhaven.example" method="post" enctype="text/plain">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Food Haven. All rights reserved.</p>
  </footer>
</body>
</html>
